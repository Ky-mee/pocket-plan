name = "pocketplan-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "pocketplan-3926e"
# Comma-separated websites allowed to call the proxy (no trailing slash).
# Add your Firebase Hosting URL(s) here, e.g. https://pocketplan-3926e.web.app
ALLOWED_ORIGINS = "https://pocketplan-3926e.web.app,https://pocketplan-3926e.firebaseapp.com"
# Dev only: allow http://localhost:<any port>. Set to "false" for production.
ALLOW_LOCALHOST = "false"
# AI chats per user per day.
DAILY_LIMIT = "30"

# Create with:  npx wrangler kv namespace create RATE_KV
# then paste the id below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "81861ec67e6c4561b1ec24afcea83236"
